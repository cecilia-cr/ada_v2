version: '3.8'

services:
  # Python Backend (The Brain)
  backend:
    build: .
    container_name: life_os_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Mount projects directory for persistence
      - ./projects:/app/projects
      # Mount long-term memory
      - ./long_term_memory:/app/long_term_memory
      # Mount settings
      - ./settings.json:/app/settings.json
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    # For audio device access on linux (if running locally with hardware)
    # devices:
    #   - "/dev/snd:/dev/snd"

    # We can add a Database here later (Postgres/SQLite is file based)
